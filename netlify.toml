# Netlify-Konfiguration für Spence
# Deploy: manuell via Netlify Drop (Ordner droppen) oder `netlify deploy --prod`.
# Der Ordner /fonts liegt lokal vor (siehe .gitignore) und wird beim
# Publish mit hochgeladen, ohne im öffentlichen GitHub-Repo zu landen.

[build]
  publish = "."

# Schrift-Dateien langfristig cachen (unveränderlich)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icons ebenfalls cachen
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
